<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>【紅尻川賊仔事件】</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Iansui (芫荽) -->
    <link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Iansui', '"芫荽"', 'cursive', 'sans-serif'],
                    },
                    animation: {
                        'pop-in': 'popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        'bounce-subtle': 'bounceSubtle 2s infinite',
                    },
                    keyframes: {
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.5) translateY(20px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
                        },
                        bounceSubtle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-4px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            font-family: 'Iansui', '芫荽', cursive, sans-serif !important;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Yellow Polka Dot Background Theme */
        body {
            background-color: #fefce8; /* Yellow 50 */
            background-image: radial-gradient(#eab308 2px, transparent 2px); /* Amber 500 dot grid */
            background-size: 22px 22px;
        }

        .cute-card-shadow {
            box-shadow: 0 4px 0px 0px rgba(234, 179, 8, 0.3), 0 6px 10px -2px rgba(0, 0, 0, 0.05);
        }
        
        .cute-focus-shadow {
            box-shadow: 0 12px 0px 0px rgba(234, 179, 8, 0.4), 0 16px 25px -5px rgba(0, 0, 0, 0.12);
        }

        /* Prevent overlap and keep clean borders */
        .card-box {
            container-type: inline-size;
            position: relative;
            background-color: #ffffff !important;
            overflow: hidden;
        }
    </style>
</head>
<body class="text-slate-800 h-[100dvh] w-screen flex flex-col justify-between select-none overflow-hidden cursor-pointer p-0 m-0">

    <header class="bg-white/95 backdrop-blur-md border-b-2 border-amber-300 sticky top-0 z-30 px-3 py-1.5 sm:py-2 shadow-sm shrink-0">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
            
            <!-- Title -->
            <div class="flex items-center space-x-2 min-w-0">
                <div class="bg-amber-500 text-white font-black px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-xl shadow-sm text-xs sm:text-base animate-bounce-subtle shrink-0">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <h1 class="text-base sm:text-xl md:text-2xl font-black tracking-wide text-amber-950 drop-shadow-sm truncate">
                    【紅尻川賊仔事件】
                </h1>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                <!-- Reset Progress -->
                <button id="resetDrawsBtn" class="p-1.5 sm:p-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 border-2 border-amber-300 transition active:scale-95" title="重置進度">
                    <i class="fa-solid fa-rotate-right text-xs sm:text-base"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full px-2 sm:px-4 py-1.5 sm:py-2 flex-1 flex flex-col justify-between overflow-hidden gap-1.5 sm:gap-2 min-h-0">
        
        <!-- Progress Indicator -->
        <div class="flex items-center justify-between text-xs sm:text-sm font-black text-slate-600 bg-white/90 px-3 sm:px-4 py-1 sm:py-1.5 rounded-xl border-2 border-amber-300 shadow-sm max-w-xs sm:max-w-sm mx-auto w-full shrink-0">
            <span>複習進度</span>
            <div class="flex items-center space-x-2">
                <div class="w-20 sm:w-36 bg-amber-100 h-2 sm:h-2.5 rounded-full overflow-hidden border border-amber-300">
                    <div id="progressBar" class="bg-gradient-to-r from-amber-400 to-yellow-500 h-full transition-all duration-300 w-0"></div>
                </div>
                <span class="text-amber-950 font-black"><span id="drawnCardsCount">0</span> / <span id="totalCardsCount">6</span></span>
            </div>
        </div>

        <!-- Dynamic Card Rows Container -->
        <div id="rowsContainer" class="flex-1 flex flex-col justify-between gap-1.5 sm:gap-2 max-w-6xl mx-auto w-full min-h-0 py-1">
            <!-- Rendered by JS -->
        </div>

    </main>

    <!-- Enlarged Card Focus Modal -->
    <div id="focusModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex flex-col items-center justify-between p-3 sm:p-6 hidden opacity-0 transition-opacity duration-300">
        
        <!-- Modal Top Control Bar -->
        <div class="w-full max-w-3xl flex items-center justify-between z-10 shrink-0">
            <div class="px-3 sm:px-4 py-1 sm:py-1.5 bg-white/95 rounded-full border-2 border-amber-300 flex items-center gap-2 text-slate-700 text-xs sm:text-sm font-black shadow-sm">
                <span id="slotStatusDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
                <span id="modalProgressText">1 / 10</span>
            </div>

            <button id="closeFocusModalBtn" class="p-2 text-slate-500 hover:text-slate-800 bg-white hover:bg-slate-100 rounded-full transition border-2 border-slate-200 shadow-sm">
                <i class="fa-solid fa-xmark text-lg sm:text-xl w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center"></i>
            </button>
        </div>

        <!-- Enlarged Card Area -->
        <div id="cardStage" class="flex-1 w-full max-w-2xl my-auto flex items-center justify-center cursor-pointer p-2 min-h-0">
            <div id="focusCard" class="w-full h-[65vh] max-h-[500px] bg-white rounded-3xl border-4 sm:border-8 border-amber-400 cute-focus-shadow p-3 sm:p-6 flex flex-col items-center justify-center relative overflow-hidden transform transition-all duration-300 hover:scale-[1.01]">
                
                <!-- Radial Glow Effects -->
                <div class="absolute -top-16 -right-16 w-40 sm:w-52 h-40 sm:h-52 bg-amber-200/60 rounded-full blur-2xl pointer-events-none"></div>
                <div class="absolute -bottom-16 -left-16 w-40 sm:w-52 h-40 sm:h-52 bg-yellow-200/60 rounded-full blur-2xl pointer-events-none"></div>

                <!-- Slot Machine Spinner Overlay & Container -->
                <div class="my-auto flex items-center justify-center w-full h-full p-2 relative z-10 overflow-hidden">
                    <!-- Spinning Strip Container -->
                    <div id="slotStrip" class="w-full h-full flex flex-col items-center justify-center space-y-4">
                        <img id="modalFruitImg" src="" alt="白話字卡片" class="w-full h-full object-contain rounded-2xl drop-shadow-md select-none" />
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- 6 Cards mapped across 2 rows (3 in Row 1, 3 in Row 2) ---
        const DEFAULT_ROW_GROUPS = [
            [
                { name: '卡片 975', id: '975' },
                { name: '卡片 976', id: '976' }, 
                { name: '卡片 977', id: '977' }
            ],
            [
                { name: '卡片 975', id: '975' },
                { name: '卡片 979', id: '979' },
                { name: '卡片 980', id: '980' }
            ]
        ];

        let ROW_GROUPS = JSON.parse(JSON.stringify(DEFAULT_ROW_GROUPS));
        let drawnIds = new Set();
        let isSpinning = false;
        let spinInterval = null;
        let audioCtx = null;

        // Initialize Web Audio API for slot machine sound effects
        function playTickSound(freq = 440, duration = 0.05, type = 'sine') {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Ignore audio errors if blocked by browser autoplay policy
            }
        }

        function playWinSound() {
            playTickSound(523.25, 0.1, 'triangle'); // C5
            setTimeout(() => playTickSound(659.25, 0.1, 'triangle'), 100); // E5
            setTimeout(() => playTickSound(783.99, 0.15, 'triangle'), 200); // G5
            setTimeout(() => playTickSound(1046.50, 0.3, 'triangle'), 300); // C6
        }

        // Row Theme Styling
        function getRegionTheme(rowIndex) {
            const themes = [
                {
                    border: 'border-amber-400',
                    hoverBorder: 'hover:border-amber-500',
                    badgeBg: 'bg-amber-100 text-amber-800 border-amber-300',
                    modalBorder: 'border-amber-400'
                },
                {
                    border: 'border-emerald-400',
                    hoverBorder: 'hover:border-emerald-500',
                    badgeBg: 'bg-emerald-100 text-emerald-800 border-emerald-300',
                    modalBorder: 'border-emerald-400'
                },
                {
                    border: 'border-rose-400',
                    hoverBorder: 'hover:border-rose-500',
                    badgeBg: 'bg-rose-100 text-rose-800 border-rose-300',
                    modalBorder: 'border-rose-400'
                }
            ];
            return themes[rowIndex % themes.length];
        }

        // Handle image error cleanly without external fallback images
        function handleImageError(imgEl, item) {
            const parent = imgEl.parentElement;
            if (!parent) return;
            imgEl.style.display = 'none';
            
            // Prevent duplicate placeholders
            if (parent.querySelector('.missing-placeholder')) return;

            const placeholder = document.createElement('div');
            placeholder.className = 'missing-placeholder flex flex-col items-center justify-center w-full h-full text-slate-400 p-2 text-center select-none';
            placeholder.innerHTML = `
                <i class="fa-regular fa-image text-2xl sm:text-4xl mb-1.5 text-slate-300"></i>
                <span class="text-xs sm:text-sm font-bold text-slate-500">請放入 ${item.id}.png</span>
            `;
            parent.appendChild(placeholder);
        }

        // Render Grid Cards
        function renderCards() {
            const container = document.getElementById('rowsContainer');
            container.innerHTML = '';
            let totalCount = 0;

            ROW_GROUPS.forEach((row, rIdx) => {
                const theme = getRegionTheme(rIdx);
                const rowDiv = document.createElement('div');
                const colClass = 'grid-cols-3';
                rowDiv.className = `flex-1 grid ${colClass} gap-1.5 sm:gap-2.5 w-full min-h-0 items-stretch`;

                row.forEach((item, cIdx) => {
                    const uniqueKey = `${rIdx}-${cIdx}-${item.id}`;
                    totalCount++;
                    const isDrawn = drawnIds.has(uniqueKey);

                    const card = document.createElement('div');
                    card.dataset.key = uniqueKey;
                    card.className = `card-box rounded-2xl sm:rounded-3xl border-3 sm:border-4 ${theme.border} ${theme.hoverBorder} cute-card-shadow flex flex-col items-center justify-center p-1.5 sm:p-2.5 cursor-pointer transition-all duration-200 hover:-translate-y-0.5 active:scale-95 ${isDrawn ? 'ring-4 ring-amber-400/50 bg-amber-50/30' : ''}`;

                    // Drawn indicator badge
                    if (isDrawn) {
                        const checkBadge = document.createElement('div');
                        checkBadge.className = 'absolute top-1.5 right-1.5 sm:top-2 sm:right-2 w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs shadow-sm z-20';
                        checkBadge.innerHTML = '<i class="fa-solid fa-check"></i>';
                        card.appendChild(checkBadge);
                    }

                    // Image wrapper
                    const imgWrapper = document.createElement('div');
                    imgWrapper.className = 'w-full h-full flex items-center justify-center overflow-hidden rounded-xl';

                    const img = document.createElement('img');
                    img.src = `${item.id}.png`;
                    img.alt = item.name;
                    img.className = 'w-full h-full object-contain select-none pointer-events-none transition-transform duration-300';
                    img.onerror = () => handleImageError(img, item);

                    imgWrapper.appendChild(img);
                    card.appendChild(imgWrapper);

                    // Direct click on a card opens it immediately without slot spin
                    card.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openCardFocus(item, uniqueKey, rIdx, false);
                    });

                    rowDiv.appendChild(card);
                });

                container.appendChild(rowDiv);
            });

            document.getElementById('totalCardsCount').textContent = totalCount;
            updateProgressUI(totalCount);
        }

        // Update Progress Bar
        function updateProgressUI(totalCount) {
            const count = drawnIds.size;
            document.getElementById('drawnCardsCount').textContent = count;
            const pct = totalCount > 0 ? Math.min(100, Math.round((count / totalCount) * 100)) : 0;
            document.getElementById('progressBar').style.width = `${pct}%`;
        }

        // Get all flattened card items
        function getAllCardItems() {
            const list = [];
            ROW_GROUPS.forEach((row, rIdx) => {
                row.forEach((item, cIdx) => {
                    list.push({
                        item,
                        uniqueKey: `${rIdx}-${cIdx}-${item.id}`,
                        rIdx
                    });
                });
            });
            return list;
        }

        // Draw Random Card with 3-Second Slot Machine Animation
        function drawRandomCard() {
            if (isSpinning) return;

            const allItems = getAllCardItems();
            if (allItems.length === 0) return;

            // Prefer undrawn cards if available
            const undrawn = allItems.filter(entry => !drawnIds.has(entry.uniqueKey));
            const pool = undrawn.length > 0 ? undrawn : allItems;
            const chosen = pool[Math.floor(Math.random() * pool.length)];

            openCardFocus(chosen.item, chosen.uniqueKey, chosen.rIdx, true);
        }

        // Open Focus Modal (with optional 3-second slot machine spin)
        function openCardFocus(targetItem, uniqueKey, rIdx, useSlotSpin = true) {
            if (isSpinning) return;

            const modal = document.getElementById('focusModal');
            const focusCard = document.getElementById('focusCard');
            const slotStrip = document.getElementById('slotStrip');
            const statusDot = document.getElementById('slotStatusDot');
            const modalProgressText = document.getElementById('modalProgressText');
            const theme = getRegionTheme(rIdx);

            // Reset modal card border color
            focusCard.className = `w-full h-[65vh] max-h-[500px] bg-white rounded-3xl border-4 sm:border-8 ${theme.modalBorder} cute-focus-shadow p-3 sm:p-6 flex flex-col items-center justify-center relative overflow-hidden transform transition-all duration-300`;

            modal.classList.remove('hidden');
            // Trigger reflow for fade-in
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');

            const allItems = getAllCardItems();

            if (!useSlotSpin) {
                drawnIds.add(uniqueKey);
                renderCards();
                statusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                modalProgressText.textContent = `已抽出 (${drawnIds.size} / ${allItems.length})`;
                displayFinalCardInModal(slotStrip, targetItem);
                playWinSound();
                return;
            }

            // Start 3-second Slot Machine Spin
            isSpinning = true;
            statusDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping';
            modalProgressText.textContent = '隨機抽卡中...';

            const duration = 3000; // 3 seconds
            const startTime = Date.now();
            let stepDelay = 60;

            function spinStep() {
                const elapsed = Date.now() - startTime;
                if (elapsed >= duration) {
                    // Stop spinning and land on chosen card
                    isSpinning = false;
                    drawnIds.add(uniqueKey);
                    renderCards();

                    statusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                    modalProgressText.textContent = `抽中卡片！ (${drawnIds.size} / ${allItems.length})`;
                    displayFinalCardInModal(slotStrip, targetItem, true);
                    playWinSound();
                    return;
                }

                // Pick random preview card during spin
                const randomPreview = allItems[Math.floor(Math.random() * allItems.length)].item;
                displayFinalCardInModal(slotStrip, randomPreview, false);
                playTickSound(320 + Math.random() * 200, 0.04, 'sine');

                // Gradually slow down the slot machine near the end
                const progress = elapsed / duration;
                if (progress > 0.7) {
                    stepDelay = 180;
                } else if (progress > 0.45) {
                    stepDelay = 110;
                }

                spinInterval = setTimeout(spinStep, stepDelay);
            }

            spinStep();
        }

        // Helper to render image or fallback inside modal
        function displayFinalCardInModal(container, item, animatePop = false) {
            container.innerHTML = '';
            const img = document.createElement('img');
            img.src = `${item.id}.png`;
            img.alt = item.name;
            img.className = `w-full h-full object-contain rounded-2xl drop-shadow-md select-none ${animatePop ? 'animate-pop-in' : ''}`;
            img.onerror = () => handleImageError(img, item);
            container.appendChild(img);
        }

        // Close Modal
        function closeModal() {
            if (isSpinning) return;
            const modal = document.getElementById('focusModal');
            if (modal.classList.contains('hidden')) return;

            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 250);
        }

        // Reset Progress
        function resetProgress(e) {
            if (e) e.stopPropagation();
            if (isSpinning) return;
            drawnIds.clear();
            renderCards();
            playTickSound(600, 0.08, 'triangle');
        }

        // Event Listeners Setup
        document.addEventListener('DOMContentLoaded', () => {
            renderCards();

            // Reset button
            document.getElementById('resetDrawsBtn').addEventListener('click', resetProgress);

            // Close modal button
            document.getElementById('closeFocusModalBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                closeModal();
            });

            // Click anywhere on background/body to draw or close modal
            document.body.addEventListener('click', (e) => {
                if (isSpinning) return;
                const modal = document.getElementById('focusModal');
                if (!modal.classList.contains('hidden')) {
                    closeModal();
                } else {
                    drawRandomCard();
                }
            });

            // Right-click support for drawing / closing
            document.body.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                if (isSpinning) return;
                const modal = document.getElementById('focusModal');
                if (!modal.classList.contains('hidden')) {
                    closeModal();
                } else {
                    drawRandomCard();
                }
            });

            // Keyboard & Presenter Remote support (Space, Enter, PageDown, ArrowRight, Escape)
            document.addEventListener('keydown', (e) => {
                if (isSpinning) return;
                const modal = document.getElementById('focusModal');
                const isModalOpen = !modal.classList.contains('hidden');

                if (e.key === 'Escape') {
                    if (isModalOpen) closeModal();
                    return;
                }

                if ([' ', 'Enter', 'ArrowRight', 'PageDown', 'ArrowDown'].includes(e.key)) {
                    e.preventDefault();
                    if (isModalOpen) {
                        closeModal();
                    } else {
                        drawRandomCard();
                    }
                }
            });
        });
    </script>
</body>
</html>
